apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  demo-api.json: |
    {
      "title": "DevSecOps demo-api",
      "uid": "devsecops-demo-api",
      "tags": ["devsecops", "demo-api"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "demo-api HTTP request rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=~\".*demo-api.*\"}[5m]))",
              "legendFormat": "requests/s",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "demo-api HTTP p95 latency",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=~\".*demo-api.*\"}[5m])) by (le))",
              "legendFormat": "p95 latency",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "demo-api scrape up",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "up{job=~\".*demo-api.*\"}",
              "legendFormat": "up",
              "refId": "A"
            }
          ]
        }
      ]
    }
