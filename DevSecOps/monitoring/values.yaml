# kube-prometheus-stack values for the DevSecOps lab
grafana:
  adminPassword: "lab-only-change-me"
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folder: /tmp/dashboards

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d

alertmanager:
  enabled: false
