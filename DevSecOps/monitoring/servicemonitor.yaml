apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-api
  namespace: demo-dev
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  namespaceSelector:
    matchNames:
      - demo-dev
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
