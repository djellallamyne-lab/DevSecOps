apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "demo-api.fullname" . }}-reader
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "demo-api.fullname" . }}-reader
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "demo-api.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "demo-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
