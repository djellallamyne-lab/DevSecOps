services:
  registry:
    image: registry:2.8.3
    container_name: devsecops-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry

  jenkins:
    image: jenkins/jenkins:2.479.1-lts-jdk21
    container_name: devsecops-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dcasc.jenkins.config=/var/jenkins_home/casc_configs
      # Overridden at runtime via Ansible Vault / compose env file — never commit real passwords
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-lab-only-change-me}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../jenkins/casc:/var/jenkins_home/casc_configs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - registry

volumes:
  registry_data:
  jenkins_home:
