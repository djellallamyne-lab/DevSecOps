# Checkov configuration for IaC / Dockerfile / Helm
compact: true
framework:
  - dockerfile
  - kubernetes
  - helm
  - terraform
quiet: false
# Soft-fail low noise checks that conflict with local lab defaults
skip-check:
  - CKV_DOCKER_2   # HEALTHCHECK present in Dockerfile; skip if false positive on multi-stage
soft-fail: false
download-external-modules: false
