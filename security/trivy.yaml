# Trivy configuration — fail on HIGH/CRITICAL
# Document accepted risks below with CVE, reason, and review date.

severity:
  - HIGH
  - CRITICAL

exit-code: 1
ignore-unfixed: false

# Accepted risks (empty by default — add only with justification)
# ignore:
#   - id: CVE-XXXX-YYYY
#     statement: "Reason for acceptance — review by YYYY-MM-DD"

scan:
  skip-dirs:
    - backups
    - .git
    - "**/build"
    - "**/.gradle"
