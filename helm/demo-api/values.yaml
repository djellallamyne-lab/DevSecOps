replicaCount: 1

image:
  repository: localhost:5000/demo-api
  tag: ""          # set by CI to sha-<git> — never use latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: demo-api
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 40
    periodSeconds: 15
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10

# App secret created at deploy — value from --set or Vault, not committed
appSecret:
  create: true
  message: "Hello from DevSecOps demo-api"

networkPolicy:
  enabled: true
  # Allow scrape from monitoring namespace
  allowMonitoringNamespace: monitoring

podLabels:
  app.kubernetes.io/name: demo-api
  app.kubernetes.io/part-of: devsecops-lab
