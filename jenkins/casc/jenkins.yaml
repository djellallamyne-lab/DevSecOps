jenkins:
  systemMessage: "DevSecOps lab — scan-then-push pipeline"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-lab-only-change-me}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  remotingSecurity:
    enabled: true
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false
  markupFormatter:
    rawHtml:
      disableSyntaxHighlighting: false

unclassified:
  location:
    url: "http://localhost:8081/"
    adminAddress: "devsecops-lab@localhost"

tool:
  git:
    installations:
      - name: Default
        home: git
